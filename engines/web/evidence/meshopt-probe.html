<body style="background:#122326;color:white"><h1>Required EXT_meshopt_compression</h1><pre id="result">Loading local compressed GLB…</pre><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from '../woods-alight-v5/vendor/three/examples/jsm/loaders/GLTFLoader.js';
import {MeshoptDecoder} from '../woods-alight-v5/vendor/three/examples/jsm/libs/meshopt_decoder.module.js';
try {
const data=await (await fetch('lantern.meshopt.glb')).arrayBuffer();
const doc=JSON.parse(new TextDecoder().decode(new Uint8Array(data,20,new DataView(data).getUint32(12,true))));
if(!doc.extensionsRequired?.includes('EXT_meshopt_compression'))throw Error('Probe requires actual meshopt extension');
const gltf=await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).parseAsync(data,'');
const scene=new THREE.Scene();scene.background=new THREE.Color('#122326');scene.add(gltf.scene,new THREE.HemisphereLight(0xffffff,0x334433,3));
const box=new THREE.Box3().setFromObject(gltf.scene),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
const camera=new THREE.PerspectiveCamera(40,1,.001,20);camera.position.copy(center).add(new THREE.Vector3(size.y*1.4,size.y*.6,size.y*1.9));camera.lookAt(center);
const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(2,3,4);scene.add(light);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(550,550);document.body.append(renderer.domElement);renderer.render(scene,camera);
let meshes=0,vertices=0;gltf.scene.traverse(m=>{if(m.isMesh){meshes++;vertices+=m.geometry.getAttribute('position').count;}});
window.meshoptProof={passed:true,required:doc.extensionsRequired,meshes,vertices,triangles:renderer.info.render.triangles,drawCalls:renderer.info.render.calls,decoder:'local Three.js bundled Meshoptimizer 1.1; embedded WASM'};
document.querySelector('#result').textContent=JSON.stringify(window.meshoptProof,null,2);
}catch(error){window.meshoptProof={passed:false,error:error.message};document.querySelector('#result').textContent=error.stack;console.error(error);}
</script>
